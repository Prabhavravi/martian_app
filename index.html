<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Martian Rover</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game" aria-label="Martian rover simulator">
    <canvas id="view" aria-label="First-person Martian panorama"></canvas>
    <div class="rover-frame" aria-hidden="true"></div>
    <section id="hud" class="hud" aria-live="polite">
      <div class="brand"><span class="brand-mark">◉</span><span>MARTIAN ROVER</span></div>
      <div id="telemetry" class="telemetry">HEADING <span id="heading">000° N</span> <span class="divider">/</span> GRID <span id="coords">01 · 01</span></div>
      <div id="hint" class="hint">A / D · TURN &nbsp;&nbsp; W / S · DRIVE</div>
    </section>
    <div id="loading" class="loading">
      <div class="loading-card">
        <div class="loading-kicker">MISSION CONTROL · OFFLINE SIMULATION</div>
        <h1>Calibrating rover optics</h1>
        <div class="progress"><span id="progress-bar"></span></div>
        <p id="progress-text">Loading Martian panoramas · 0%</p>
      </div>
    </div>
  </main>
  <script src="world.js"></script>
  <script src="game.js"></script>
</body>
</html>
